version: 2

models:
  - name: int_media_reconciliation

    description: >
      Réconciliation mensuelle par canal entre les dépenses du
      campaign export et les montants planifiés/facturés du media plan.
      Le modèle conserve également les cas présents dans une seule source.

    columns:
      - name: month
        description: "Mois d'analyse"
        tests:
          - not_null

      - name: channel
        description: "Canal marketing normalisé"
        tests:
          - not_null

      - name: source_coverage
        description: >
          Indique si les informations sont disponibles dans les deux
          sources ou dans une seule.

      - name: campaign_vs_invoiced_variance_fcfa
        description: >
          Dépense issue du campaign export moins facture connue
          du media plan.

      - name: campaign_to_invoiced_ratio
        description: >
          Rapport entre dépense campaign export et montant facturé.

  - name: int_sales_calendar
    description: >
      Calendrier quotidien de la période d'analyse permettant de
      distinguer les jours disposant de données de ventes des jours
      où la source était absente.

    columns:
      - name: sale_date
        description: "Date du calendrier"
        tests:
          - not_null
          - unique

      - name: month
        description: "Mois de la date"

      - name: week_start
        description: "Début de la semaine"

      - name: has_sales_data
        description: >
          TRUE si au moins une observation de vente existe pour la date.

      - name: is_missing_sales_day
        description: >
          TRUE lorsque aucune observation de vente n'existe dans la source.

  - name: int_campaign_normalized

    description: >
      Enrichissement déterministe des campagnes marketing avec
      extraction du produit et du mois mentionné dans le nom de campagne.

    columns:
      - name: month
        description: "Mois de rattachement provenant de la date de campagne"
        tests:
          - not_null

      - name: channel
        description: "Canal marketing"
        tests:
          - not_null

      - name: campaign_name
        description: "Nom de campagne"
        tests:
          - not_null

  - name: int_whatsapp_items

    description: >
      Transformation des commandes WhatsApp en lignes produit.
      Les cas simples sont parsés par règles déterministes.
      Les cas non résolus sont identifiés pour un traitement IA ultérieur.

    columns:
      - name: whatsapp_row_id
        description: "Identifiant technique de la commande source"
        tests:
          - not_null

      - name: order_ref
        description: "Référence métier de commande"
        tests:
          - not_null

      - name: product
        description: "Produit extrait"

      - name: format
        description: "Format extrait"

      - name: quantity
        description: "Quantité extraite"
        tests:
          - not_null

      - name: parse_status
        description: "Résultat du parsing"

  - name: int_whatsapp_order_quality
    description: "Qualité du parsing WhatsApp au grain d'une ligne de commande source."
    columns:
      - name: whatsapp_row_id
        description: "Identifiant technique de la ligne source WhatsApp."
        tests:
          - not_null
          - unique

      - name: order_ref
        description: "Référence de commande source."

      - name: item_line_count
        description: "Nombre de lignes d'items produites pour la commande."

      - name: parsed_item_lines
        description: "Nombre de lignes entièrement parsées."

      - name: unresolved_item_lines
        description: "Nombre de lignes avec produit inconnu."

      - name: missing_format_lines
        description: "Nombre de lignes dont le produit est connu mais le format absent."

      - name: quantity_total
        description: "Quantité totale extraite des lignes d'items."

      - name: amount_missing
        description: "TRUE si amount_fcfa est vide. Une commande sans montant n'est pas à zéro : son montant est inconnu."

      - name: amount_outlier
        description: >
          TRUE si amount_fcfa dépasse var whatsapp_max_plausible_amount_fcfa
          (montant invraisemblable pour 2 à 4 bouteilles). Le montant brut est
          conservé dans amount_fcfa, jamais corrigé.

      - name: amount_plausible_fcfa
        description: "amount_fcfa hors montants aberrants ; NULL si manquant ou aberrant. Base des totaux."

      - name: order_parse_status
        description: "Statut synthétique du parsing de la commande."

  - name: int_social_comments_enriched
    description: >
      Commentaires sociaux dédupliqués joints à leurs prédictions IA
      (LEFT JOIN sur comment_id). Grain : 1 ligne = 1 commentaire. Un commentaire
      sans prédiction ressort avec des NULL : le test
      int_social_comments_predictions_complete le rend visible.
    columns:
      - name: comment_id
        description: "Identifiant du commentaire."
        tests:
          - not_null
          - unique
      - name: sentiment_model
        description: "Sentiment prédit : positive, negative ou neutral."
      - name: theme_model
        description: "Thème prédit."
      - name: product_model
        description: "Produit prédit ; 'unknown' = non identifiable, ce n'est pas un produit."
      - name: is_spam_model
        description: "Spam prédit (classification à améliorer : voir docs/ai_documentation)."

  - name: int_pos_dimension
    description: >
      Dimension point de vente : 1 ligne = 1 magasin (pos_key = nom sans accents,
      en minuscules). Regroupe les pos_id qui désignent le même magasin sous une
      casse ou une orthographe différente. Aucune fusion approximative.
    columns:
      - name: pos_key
        description: "Clé canonique du magasin."
        tests:
          - not_null
          - unique
      - name: canonical_pos_id
        description: "Premier pos_id historique du magasin."
      - name: pos_id_count
        description: "Nombre de pos_id ayant désigné ce magasin."
      - name: pos_id_changed
        description: "TRUE si le magasin a changé d'identifiant."

  - name: int_product_dimension
    description: >
      Dimension produit : 1 ligne = 1 SKU des ventes POS, traduit en produit,
      format et volume en litres. Un SKU inconnu reste à NULL (jamais inventé) et
      fait échouer le test int_product_dimension_mapped.
    columns:
      - name: product_sku
        description: "SKU source (ex. BIS-1L)."
        tests:
          - not_null
          - unique
      - name: product
        description: "bissap, gingembre ou bouye."
      - name: format
        description: "1L ou 33cl."
      - name: volume_litres
        description: "Volume d'une unité en litres (1,0 ou 0,33)."

